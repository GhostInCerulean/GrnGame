name: tests

on:
  workflow_call:

jobs:
  auto-tests:
    runs-on: ubuntu-22.04
    name: "auto tests / linux-x64 / embedded = false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache-tests-linux-x64'
          package-cache: true
          build-cache: true

      - name: Update xmake repo
        run: xmake repo -u

      - name: Setup Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libgles2 mesa-vulkan-drivers

      - name: Setup Virtual Audio (PulseAudio + null sink)
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils libpulse0
          pulseaudio --start --exit-idle-time=-1 --log-target=stderr
          for i in $(seq 1 10); do
            pactl info > /dev/null 2>&1 && break
            sleep 1
          done
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description=VirtualSpeaker
          pactl set-default-sink virtual_speaker
          pactl info
          pactl list short sinks

      - name: Configure
        run: >
          xmake config --clean
          -m release
          -y -vv
          --embed_assets=false

      - name: Run auto tests
        env:
          SDL_AUDIODRIVER: pulseaudio
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
        run: xvfb-run -a -s "-screen 0 1280x720x24" xmake run auto_tests -vv