name: Build web

on:
  workflow_call:

jobs:
  build-wasm:
    runs-on: ubuntu-22.04
    name: "wasm / release"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache-wasm'
          package-cache: true
          build-cache: true

      - name: update xmake repo
        run: xmake repo -u

      - name: clean xmake packages
        run: |
          rm -rf ~/.xmake/packages
          rm -rf ~/.xmake/cache

      - name: Configure
        run: >
          xmake f -p wasm -c
          -y -vv
          --embed_assets=y
          --wasm_threads=y

      - name: Build
        run: xmake build -y -vv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "wasm-release-embedtrue"
          path: build/Runtime/